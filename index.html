<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>J.A.R.V.I.S. — Stark Industries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050810; --panel:rgba(12,18,32,.82); --panel2:rgba(17,26,43,.9);
  --border:#1a2540; --border-glow:rgba(34,211,238,.35);
  --cyan:#22d3ee; --cyan-dim:rgba(34,211,238,.55);
  --amber:#fbbf24; --red:#f87171; --green:#34d399;
  --text:#cfe6f5; --muted:#5b7a99;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --sans:'Inter',-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--mono);
  overflow:hidden; height:100dvh;
  background-image:
    radial-gradient(1200px 700px at 70% -10%, rgba(34,211,238,.07), transparent 60%),
    radial-gradient(900px 600px at 10% 110%, rgba(251,191,36,.05), transparent 60%);
}
/* scanlines */
body::after{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:60;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
}
/* vignette */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:59;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55));
}

/* ============ BOOT ============ */
#boot{
  position:fixed; inset:0; z-index:100; background:#02040a;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:26px; padding:24px; transition:opacity .8s ease;
}
#boot.off{opacity:0; pointer-events:none}
#boot .logo{
  width:120px; height:120px; position:relative;
  animation:bootPulse 2.2s ease-in-out infinite;
}
@keyframes bootPulse{0%,100%{filter:drop-shadow(0 0 18px rgba(34,211,238,.5))}50%{filter:drop-shadow(0 0 40px rgba(34,211,238,.9))}}
#bootLog{
  width:min(520px,90vw); height:150px; overflow:hidden;
  font-size:11px; line-height:1.7; color:var(--cyan-dim);
  letter-spacing:.05em; text-transform:uppercase;
}
#bootLog div{opacity:0; animation:bootLine .3s forwards}
@keyframes bootLine{to{opacity:1}}
#bootStart{
  font-family:var(--mono); font-size:13px; letter-spacing:.3em; text-transform:uppercase;
  color:var(--cyan); background:transparent; border:1px solid var(--border-glow);
  padding:16px 42px; min-height:44px; cursor:pointer; position:relative;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  transition:background .2s, color .2s;
}
#bootStart:active,#bootStart:hover{background:var(--cyan); color:#04121a}

/* ============ LAYOUT ============ */
#app{
  height:100dvh; display:grid; grid-template-rows:auto 1fr auto;
  opacity:0; transition:opacity 1s ease .2s;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  gap:10px;
}
#app.on{opacity:1}

header{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  border:1px solid var(--border); background:var(--panel);
  padding:10px 16px; backdrop-filter:blur(8px);
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
}
.brand{font-weight:700; letter-spacing:.28em; font-size:13px; color:var(--cyan)}
.brand small{color:var(--muted); letter-spacing:.18em; font-weight:300; font-size:9px; display:block}
.leds{display:flex; gap:8px; margin-left:6px}
.led{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulseDot 1.5s ease-in-out infinite}
.led.amber{background:var(--amber);box-shadow:0 0 8px var(--amber);animation-delay:.4s}
.led.cyan{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation-delay:.8s}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}
.head-spacer{flex:1}
.head-item{font-size:10px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; text-align:right}
.head-item b{display:block; color:var(--text); font-size:13px; letter-spacing:.08em; font-weight:500}
.live-badge{
  display:flex; align-items:center; gap:7px; font-size:10px; letter-spacing:.2em;
  color:var(--green); text-transform:uppercase;
}
.live-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulseDot 1.4s infinite}
.icon-btn{
  background:transparent; border:1px solid var(--border); color:var(--muted);
  width:44px; height:44px; cursor:pointer; display:grid; place-items:center;
  transition:color .15s,border-color .15s; font-family:var(--mono);
}
.icon-btn:hover,.icon-btn.active{color:var(--cyan); border-color:var(--border-glow)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

main{
  display:grid; grid-template-columns:280px 1fr 380px; gap:10px; min-height:0;
}
.panel{
  border:1px solid var(--border); background:var(--panel);
  backdrop-filter:blur(8px); display:flex; flex-direction:column; min-height:0;
  position:relative; overflow:hidden;
}
.panel-title{
  font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted);
  padding:12px 14px 10px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:8px; flex-shrink:0;
}
.panel-title::before{content:''; width:6px; height:6px; background:var(--cyan); box-shadow:0 0 6px var(--cyan)}
.panel-title .right{margin-left:auto; color:var(--cyan-dim); letter-spacing:.1em}

/* ---- LEFT: SYSTEM ---- */
#sysBody{padding:12px 14px; display:flex; flex-direction:column; gap:14px; overflow-y:auto}
.gauge-block{display:flex; flex-direction:column; gap:6px}
.gauge-head{display:flex; justify-content:space-between; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
.gauge-head b{color:var(--cyan); font-weight:500; font-size:11px}
.gauge-canvas{width:100%; height:44px; display:block}
.bar-row{display:flex; align-items:center; gap:10px; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.bar-row span{width:64px; flex-shrink:0}
.bar{flex:1; height:4px; background:rgba(34,211,238,.1); position:relative; overflow:hidden}
.bar i{position:absolute; inset:0; right:auto; background:var(--cyan); box-shadow:0 0 8px var(--cyan-dim); transition:width .6s ease}
.bar-row b{width:44px; text-align:right; color:var(--text); font-weight:500; font-size:10px}
#diagLog{font-size:9.5px; line-height:1.8; color:var(--muted); letter-spacing:.05em; text-transform:uppercase}
#diagLog .ok{color:var(--green)} #diagLog .warn{color:var(--amber)}

/* ---- CENTER: REACTOR ---- */
#center{align-items:center; justify-content:center; background:transparent; border:none; backdrop-filter:none}
#reactorWrap{position:relative; width:min(52vh,88vw,460px); aspect-ratio:1}
#reactor{width:100%; height:100%; display:block}
#micBtn{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:96px; height:96px; border-radius:50%; cursor:pointer;
  background:radial-gradient(circle at 35% 30%, rgba(34,211,238,.25), rgba(6,12,24,.9) 70%);
  border:1px solid var(--border-glow); color:var(--cyan);
  display:grid; place-items:center; transition:box-shadow .25s, transform .15s;
  box-shadow:0 0 30px rgba(34,211,238,.25), inset 0 0 24px rgba(34,211,238,.15);
}
#micBtn:active{transform:translate(-50%,-50%) scale(.94)}
#micBtn.listening{box-shadow:0 0 55px rgba(34,211,238,.7), inset 0 0 30px rgba(34,211,238,.35); animation:micGlow 1.2s ease-in-out infinite}
@keyframes micGlow{0%,100%{box-shadow:0 0 40px rgba(34,211,238,.5)}50%{box-shadow:0 0 70px rgba(34,211,238,.95)}}
#micBtn svg{width:34px; height:34px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
#statusLine{
  position:absolute; left:50%; transform:translateX(-50%); bottom:-8px;
  font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:var(--cyan-dim);
  white-space:nowrap; text-shadow:0 0 12px rgba(34,211,238,.5);
}
#centerCaption{
  position:absolute; top:6px; left:50%; transform:translateX(-50%);
  font-size:9px; letter-spacing:.3em; color:var(--muted); text-transform:uppercase; white-space:nowrap;
}

/* ---- RIGHT: COMMS ---- */
#chatBody{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; min-height:0}
.msg{max-width:92%; font-family:var(--sans); font-size:13.5px; line-height:1.55; animation:msgIn .35s ease both}
@keyframes msgIn{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.msg .who{font-family:var(--mono); font-size:8.5px; letter-spacing:.22em; text-transform:uppercase; margin-bottom:4px; color:var(--muted)}
.msg.jarvis{align-self:flex-start; border-left:2px solid var(--cyan); padding-left:12px; color:var(--text)}
.msg.jarvis .who{color:var(--cyan)}
.msg.user{align-self:flex-end; border-right:2px solid var(--amber); padding-right:12px; text-align:right; color:#f3e9d2}
.msg.user .who{color:var(--amber)}
.msg .cursor{display:inline-block; width:7px; height:13px; background:var(--cyan); vertical-align:-2px; animation:blink .7s steps(1) infinite; margin-left:2px}
@keyframes blink{50%{opacity:0}}
#chips{
  display:flex; gap:8px; padding:10px 14px; overflow-x:auto; flex-shrink:0;
  border-top:1px solid var(--border); scrollbar-width:none;
}
#chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  color:var(--cyan-dim); background:rgba(34,211,238,.06); border:1px solid var(--border);
  padding:9px 14px; min-height:44px; cursor:pointer; text-transform:uppercase;
  transition:color .15s,border-color .15s; white-space:nowrap;
}
.chip:hover{color:var(--cyan); border-color:var(--border-glow)}
#inputRow{display:flex; gap:8px; padding:0 14px 14px; flex-shrink:0}
#textInput{
  flex:1; background:rgba(6,12,24,.9); border:1px solid var(--border); color:var(--text);
  font-family:var(--mono); font-size:13px; padding:0 14px; min-height:44px; outline:none;
  letter-spacing:.03em;
}
#textInput:focus{border-color:var(--border-glow); box-shadow:0 0 14px rgba(34,211,238,.15)}
#textInput::placeholder{color:var(--muted)}
#sendBtn{
  background:rgba(34,211,238,.1); border:1px solid var(--border-glow); color:var(--cyan);
  font-family:var(--mono); font-size:11px; letter-spacing:.18em; padding:0 20px;
  min-height:44px; cursor:pointer; text-transform:uppercase; transition:background .15s;
}
#sendBtn:hover{background:rgba(34,211,238,.22)}

/* ---- TICKER ---- */
#ticker{
  border:1px solid var(--border); background:var(--panel); overflow:hidden;
  height:30px; display:flex; align-items:center; position:relative; flex-shrink:0;
}
#tickerTrack{
  display:inline-flex; gap:48px; white-space:nowrap; font-size:9.5px;
  letter-spacing:.2em; text-transform:uppercase; color:var(--muted);
  animation:tick 48s linear infinite; padding-left:100%;
}
#tickerTrack b{color:var(--cyan-dim); font-weight:500}
@keyframes tick{to{transform:translateX(-100%)}}

/* scrollbars */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1a2540; border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--cyan-dim)}

/* ============ RESPONSIVE ============ */
@media (max-width:1023px){
  body{overflow:auto}
  #app{height:auto; min-height:100dvh; grid-template-rows:auto auto auto}
  main{grid-template-columns:1fr; grid-template-rows:auto}
  #center{order:-1; padding:18px 0 26px}
  #reactorWrap{width:min(58vw,320px)}
  #left{max-height:280px}
  #chatBody{min-height:260px; max-height:44vh}
  .head-item.hide-m{display:none}
}
@media (max-width:430px){
  .brand{font-size:11px}
  #micBtn{width:80px;height:80px}
  #micBtn svg{width:28px;height:28px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s !important; animation-iteration-count:1 !important; transition-duration:.01s !important}
}
</style>
</head>
<body>

<!-- ================= BOOT ================= -->
<div id="boot">
  <svg class="logo" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="none" stroke="#22d3ee" stroke-width="1" opacity=".35"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8 5" opacity=".7"/>
    <circle cx="50" cy="50" r="26" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".9"/>
    <circle cx="50" cy="50" r="14" fill="#22d3ee" opacity=".9"/>
    <circle cx="50" cy="50" r="14" fill="none" stroke="#fff" stroke-width="1" opacity=".8"/>
  </svg>
  <div id="bootLog"></div>
  <button id="bootStart">Запуск системы</button>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <header>
    <div class="brand">J.A.R.V.I.S.<small>STARK INDUSTRIES · MARK VII</small></div>
    <div class="leds"><div class="led"></div><div class="led amber"></div><div class="led cyan"></div></div>
    <div class="head-spacer"></div>
    <div class="head-item">Система<b id="hStatus">ОНЛАЙН</b></div>
    <div class="head-item hide-m">Время<b id="hClock">--:--:--</b></div>
    <div class="head-item hide-m">Дата<b id="hDate">—</b></div>
    <div class="live-badge">Мониторинг</div>
    <button class="icon-btn" id="btnVoice" title="Голос вкл/выкл">
      <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <button class="icon-btn" id="btnFull" title="Во весь экран">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
  </header>

  <main>
    <!-- LEFT: SYSTEM -->
    <section class="panel" id="left">
      <div class="panel-title">Диагностика систем<span class="right">SYS.01</span></div>
      <div id="sysBody">
        <div class="gauge-block">
          <div class="gauge-head"><span>Ядро реактора</span><b id="cpuVal">0%</b></div>
          <canvas class="gauge-canvas" id="cpuCanvas"></canvas>
        </div>
        <div class="gauge-block">
          <div class="gauge-head"><span>Нейросеть</span><b id="ramVal">0%</b></div>
          <canvas class="gauge-canvas" id="ramCanvas"></canvas>
        </div>
        <div class="bar-row"><span>Батарея</span><div class="bar"><i id="batBar" style="width:0%"></i></div><b id="batVal">—</b></div>
        <div class="bar-row"><span>Сеть</span><div class="bar"><i id="netBar" style="width:0%"></i></div><b id="netVal">—</b></div>
        <div class="bar-row"><span>Мощность</span><div class="bar"><i id="powBar" style="width:0%"></i></div><b id="powVal">—</b></div>
        <div class="panel-title" style="border-top:1px solid var(--border); padding-left:0">Журнал<span class="right">LOG</span></div>
        <div id="diagLog"></div>
      </div>
    </section>

    <!-- CENTER: REACTOR -->
    <section class="panel" id="center">
      <div id="reactorWrap">
        <div id="centerCaption">ARC REACTOR · ГОЛОСОВОЕ ЯДРО</div>
        <canvas id="reactor"></canvas>
        <button id="micBtn" title="Говорить">
          <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>
        </button>
        <div id="statusLine">ИНИЦИАЛИЗАЦИЯ…</div>
      </div>
    </section>

    <!-- RIGHT: COMMS -->
    <section class="panel" id="right">
      <div class="panel-title">Канал связи<span class="right">COMMS</span></div>
      <div id="chatBody"></div>
      <div id="chips"></div>
      <div id="inputRow">
        <input id="textInput" type="text" placeholder="Введите команду, сэр…" autocomplete="off" enterkeyhint="send">
        <button id="sendBtn">Отпр.</button>
      </div>
    </section>
  </main>

  <div id="ticker"><div id="tickerTrack"></div></div>
</div>

<script>
'use strict';
/* ============================================================
   J.A.R.V.I.S. — голосовое ядро
   ============================================================ */
const $ = s => document.querySelector(s);
const state = {
  voiceOn: true, listening: false, speaking: false, continuous: false,
  amp: 0, ampTarget: 0, sarcasm: false, recog: null, voices: [],
  timers: [], analyser: null, micStream: null,
};
const rnd = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------------- BOOT ---------------- */
const bootLines = [
  '> Инициализация ядра J.A.R.V.I.S. …',
  '> Загрузка нейронных матриц ……… OK',
  '> Калибровка дугового реактора … OK',
  '> Подключение к Stark Satellite … OK',
  '> Голосовой интерфейс …………… OK',
  '> Протоколы безопасности ……… АКТИВНЫ',
  '> Все системы в норме. Готов к работе.',
];
(function boot(){
  const log = $('#bootLog');
  bootLines.forEach((l,i)=>{
    const d = document.createElement('div'); d.textContent = l;
    d.style.animationDelay = (i*0.28)+'s'; log.appendChild(d);
  });
})();
$('#bootStart').addEventListener('click', ()=>{
  $('#boot').classList.add('off');
  $('#app').classList.add('on');
  initAudioUnlock();
  setTimeout(()=> jarvisSay(rnd([
    'Системы в норме, сэр. Дуговой реактор стабилен. Чем могу помочь?',
    'Добро пожаловать, сэр. Все протоколы активны. Слушаю вас.',
  ])), 600);
},{once:true});

/* ---------------- CLOCK ---------------- */
const DAYS=['ВОСКРЕСЕНЬЕ','ПОНЕДЕЛЬНИК','ВТОРНИК','СРЕДА','ЧЕТВЕРГ','ПЯТНИЦА','СУББОТА'];
function tickClock(){
  const n = new Date();
  const p = x=>String(x).padStart(2,'0');
  $('#hClock').textContent = `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
  $('#hDate').textContent = `${p(n.getDate())}.${p(n.getMonth()+1)}.${n.getFullYear()}`;
}
setInterval(tickClock, 1000); tickClock();

/* ---------------- DIAG LOG ---------------- */
const diagMsgs = [
  ['ok','Проверка сервоприводов … OK'],['ok','Калибровка сенсоров … OK'],
  ['ok','Синхронизация спутника … OK'],['warn','Незначительные флуктуации сети'],
  ['ok','Нейроядро стабильно'],['ok','Протокол «Вероника» в режиме ожидания'],
  ['ok','Шифрование канала AES-256'],['ok','Терморегуляция в норме'],
  ['warn','Кофемашина не отвечает'],['ok','Спутниковая связь 99.7%'],
];
function pushDiag(){
  const [cls,txt] = rnd(diagMsgs);
  const n = new Date(), p=x=>String(x).padStart(2,'0');
  const el = document.createElement('div');
  el.className = cls;
  el.textContent = `[${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}] ${txt}`;
  const log = $('#diagLog'); log.prepend(el);
  while(log.children.length>6) log.lastChild.remove();
}
setInterval(pushDiag, 3800); pushDiag();

/* ---------------- BATTERY / NETWORK ---------------- */
if (navigator.getBattery) navigator.getBattery().then(b=>{
  const upd=()=>{ const v=Math.round(b.level*100);
    $('#batBar').style.width=v+'%'; $('#batVal').textContent=v+'%'+(b.charging?' ⚡':'');
    $('#batBar').style.background = v<25 ? 'var(--red)' : 'var(--cyan)'; };
  upd(); b.addEventListener('levelchange',upd); b.addEventListener('chargingchange',upd);
});
function updNet(){
  const on = navigator.onLine;
  $('#netBar').style.width = on?'96%':'4%'; $('#netVal').textContent = on?'ONLINE':'OFFLINE';
  $('#netBar').style.background = on?'var(--cyan)':'var(--red)';
}
window.addEventListener('online',updNet); window.addEventListener('offline',updNet); updNet();

/* ---------------- TICKER ---------------- */
(function ticker(){
  const t = $('#tickerTrack');
  const items = [
    '<b>STARK IND.</b> +2.4%', 'Биржа: <b>NASDAQ ▲</b>', 'Угроз не обнаружено',
    'Спутник ST-7 <b>на связи</b>', 'Реактор: <b>стабилен</b>', 'Дроны: дежурный режим',
    '<b>Щ.И.Т.</b>: канал зашифрован', 'Погода: по запросу', 'Протоколы: <b>активны</b>',
  ];
  t.innerHTML = items.map(i=>`<span>◆ ${i}</span>`).join('');
})();

/* ---------------- GAUGES (canvas graphs) ---------------- */
function makeGraph(canvasId, valId, base, spread, color){
  const c = $(canvasId), ctx = c.getContext('2d');
  const data = Array.from({length:60},()=>base + (Math.random()-.5)*spread);
  function draw(){
    const dpr = window.devicePixelRatio||1;
    const w = c.clientWidth*dpr, h = c.clientHeight*dpr;
    if (c.width!==w||c.height!==h){ c.width=w; c.height=h; }
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle='rgba(26,37,64,.9)'; ctx.lineWidth=1;
    for(let y=0;y<=3;y++){ ctx.beginPath(); ctx.moveTo(0,h*y/3); ctx.lineTo(w,h*y/3); ctx.stroke(); }
    data.push(clamp(data[data.length-1]+(Math.random()-.5)*8, 8, 97)); data.shift();
    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,color.replace(')',',.35)').replace('rgb','rgba'));
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.moveTo(0,h);
    data.forEach((v,i)=>ctx.lineTo(i/(data.length-1)*w, h-(v/100)*h));
    ctx.lineTo(w,h); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
    ctx.beginPath();
    data.forEach((v,i)=>{const x=i/(data.length-1)*w,y=h-(v/100)*h; i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.strokeStyle=color; ctx.lineWidth=1.6*dpr; ctx.shadowColor=color; ctx.shadowBlur=6*dpr; ctx.stroke();
    ctx.shadowBlur=0;
    const cur = Math.round(data[data.length-1]);
    $(valId).textContent = cur+'%';
    return cur;
  }
  return draw;
}
const drawCpu = makeGraph('#cpuCanvas','#cpuVal',45,30,'rgb(34,211,238)');
const drawRam = makeGraph('#ramCanvas','#ramVal',62,20,'rgb(251,191,36)');
setInterval(()=>{ drawCpu(); drawRam();
  const p = 70+Math.random()*28;
  $('#powBar').style.width=p+'%'; $('#powVal').textContent=(p*1.21).toFixed(1)+' ГДж';
}, 900); drawCpu(); drawRam();

/* ---------------- ARC REACTOR ---------------- */
const rc = $('#reactor'), rctx = rc.getContext('2d');
let rw=0, rh=0, cx=0, cy=0;
function sizeReactor(){
  const dpr = window.devicePixelRatio||1;
  rw = rc.clientWidth*dpr; rh = rc.clientHeight*dpr;
  rc.width=rw; rc.height=rh; cx=rw/2; cy=rh/2;
}
sizeReactor(); window.addEventListener('resize', sizeReactor);
const particles = Array.from({length:90},()=>({
  a:Math.random()*Math.PI*2, r:.35+Math.random()*.75, s:(Math.random()*.002+.0006)*(Math.random()<.5?-1:1),
  sz:Math.random()*2+0.6, o:Math.random()*.6+.2
}));
let rot=0;
function drawReactor(t){
  rctx.clearRect(0,0,rw,rh);
  const R = Math.min(rw,rh)/2*0.94;
  rot += 0.0035;
  // decay amplitude toward target
  state.amp += (state.ampTarget-state.amp)*0.12;
  const amp = state.amp;

  // outer tick ring
  rctx.save(); rctx.translate(cx,cy); rctx.rotate(rot);
  rctx.strokeStyle='rgba(34,211,238,.5)'; rctx.lineWidth=1.4;
  for(let i=0;i<72;i++){
    const a=i/72*Math.PI*2, l=i%6===0?R*0.085:R*0.035;
    rctx.beginPath();
    rctx.moveTo(Math.cos(a)*R*0.97, Math.sin(a)*R*0.97);
    rctx.lineTo(Math.cos(a)*(R*0.97-l), Math.sin(a)*(R*0.97-l));
    rctx.stroke();
  }
  rctx.restore();

  // dashed rings
  rctx.save(); rctx.translate(cx,cy); rctx.rotate(-rot*1.7);
  rctx.setLineDash([R*0.09,R*0.045]); rctx.strokeStyle='rgba(34,211,238,.65)';
  rctx.lineWidth=2; rctx.beginPath(); rctx.arc(0,0,R*0.82,0,Math.PI*2); rctx.stroke();
  rctx.restore();
  rctx.save(); rctx.translate(cx,cy); rctx.rotate(rot*2.3);
  rctx.setLineDash([R*0.02,R*0.05]); rctx.strokeStyle='rgba(251,191,36,.45)';
  rctx.lineWidth=1.4; rctx.beginPath(); rctx.arc(0,0,R*0.72,0,Math.PI*2); rctx.stroke();
  rctx.restore();
  rctx.setLineDash([]);

  // radar sweep
  const sweep = rot*3;
  const g2 = rctx.createConicGradient ? rctx.createConicGradient(sweep,cx,cy) : null;
  if (g2){
    g2.addColorStop(0,'rgba(34,211,238,.22)'); g2.addColorStop(0.12,'rgba(34,211,238,0)');
    g2.addColorStop(1,'rgba(34,211,238,0)');
    rctx.fillStyle=g2; rctx.beginPath(); rctx.moveTo(cx,cy); rctx.arc(cx,cy,R*0.68,0,Math.PI*2); rctx.fill();
  }

  // waveform ring (voice activity)
  rctx.save(); rctx.translate(cx,cy);
  rctx.beginPath();
  const seg=96;
  for(let i=0;i<=seg;i++){
    const a=i/seg*Math.PI*2;
    const w = Math.sin(a*7+t*0.006)*Math.sin(a*3-t*0.004);
    const rr = R*0.56 + w*R*0.1*(0.15+amp);
    const x=Math.cos(a)*rr, y=Math.sin(a)*rr;
    i?rctx.lineTo(x,y):rctx.moveTo(x,y);
  }
  rctx.closePath();
  rctx.strokeStyle=`rgba(34,211,238,${0.35+amp*0.6})`;
  rctx.lineWidth=1.6+amp*2;
  rctx.shadowColor='#22d3ee'; rctx.shadowBlur=12+amp*30; rctx.stroke();
  rctx.restore();

  // particles orbiting
  particles.forEach(p=>{
    p.a+=p.s;
    const pr = R*p.r*0.66;
    const x=cx+Math.cos(p.a)*pr, y=cy+Math.sin(p.a)*pr;
    rctx.fillStyle=`rgba(34,211,238,${p.o*(0.4+amp*0.6)})`;
    rctx.beginPath(); rctx.arc(x,y,p.sz*(window.devicePixelRatio||1)*0.8,0,Math.PI*2); rctx.fill();
  });

  // core glow
  const core = R*0.2*(1+amp*0.35+Math.sin(t*0.004)*0.02);
  const cg = rctx.createRadialGradient(cx,cy,0,cx,cy,core*2.4);
  cg.addColorStop(0,'rgba(255,255,255,.95)');
  cg.addColorStop(0.25,'rgba(34,211,238,.85)');
  cg.addColorStop(0.6,'rgba(34,211,238,.18)');
  cg.addColorStop(1,'rgba(34,211,238,0)');
  rctx.fillStyle=cg; rctx.beginPath(); rctx.arc(cx,cy,core*2.4,0,Math.PI*2); rctx.fill();
  // core ring
  rctx.strokeStyle='rgba(255,255,255,.7)'; rctx.lineWidth=1.2;
  rctx.beginPath(); rctx.arc(cx,cy,core,0,Math.PI*2); rctx.stroke();

  requestAnimationFrame(drawReactor);
}
requestAnimationFrame(drawReactor);
</script>

<script>
'use strict';
/* ============================================================
   ГОЛОС — синтез речи
   ============================================================ */
function loadVoices(){
  state.voices = speechSynthesis.getVoices();
}
if ('speechSynthesis' in window){
  loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(){
  const v = state.voices;
  return v.find(x=>/ru/i.test(x.lang) && /male|муж|Павел|Yuri|Dmitri/i.test(x.name))
      || v.find(x=>/ru/i.test(x.lang)) || null;
}
function initAudioUnlock(){
  // iOS требует жеста пользователя для разблокировки аудио
  if ('speechSynthesis' in window){
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0; speechSynthesis.speak(u);
  }
}
function speak(text, onEnd){
  if (!state.voiceOn || !('speechSynthesis' in window)){ onEnd&&onEnd(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if (v) u.voice = v;
  u.lang = 'ru-RU'; u.rate = 1.02; u.pitch = 0.92;
  state.speaking = true; setStatus('ГОВОРЮ…');
  const ph = setInterval(()=>{ state.ampTarget = 0.4 + Math.random()*0.6; }, 130);
  u.onend = u.onerror = ()=>{
    clearInterval(ph); state.ampTarget = 0; state.speaking = false;
    setStatus(state.listening?'СЛУШАЮ…':'ГОТОВ');
    if (state.continuous && !state.listening) startListening();
    onEnd&&onEnd();
  };
  speechSynthesis.speak(u);
}
function stopSpeaking(){ if ('speechSynthesis' in window) speechSynthesis.cancel(); state.speaking=false; state.ampTarget=0; }

/* ============================================================
   ГОЛОС — распознавание речи
   ============================================================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function setupRecognition(){
  if (!SR) return false;
  const r = new SR();
  r.lang = 'ru-RU'; r.interimResults = true; r.continuous = false;
  r.onstart = ()=>{ state.listening = true; $('#micBtn').classList.add('listening'); setStatus('СЛУШАЮ…'); };
  r.onresult = e=>{
    let interim='', final='';
    for (const res of e.results) (res.isFinal ? final+=res[0].transcript : interim+=res[0].transcript);
    if (interim) setStatus('«'+interim.trim().slice(0,42)+'…»');
    if (final){ handleCommand(final.trim()); }
  };
  r.onerror = e=>{
    stopListening();
    if (e.error==='not-allowed'||e.error==='service-not-allowed'){
      jarvisSay('Сэр, у меня нет доступа к микрофону. Проверьте разрешения в настройках браузера.');
    } else if (e.error==='network'){
      jarvisSay('Потеряна связь с сервером распознавания, сэр. Попробуйте ещё раз.');
    }
  };
  r.onend = ()=>{
    state.listening = false; $('#micBtn').classList.remove('listening');
    stopMicAnalyser();
    if (!state.speaking) setStatus('ГОТОВ');
    if (state.continuous && !state.speaking) setTimeout(()=>{ if(state.continuous&&!state.listening) startListening(); }, 350);
  };
  state.recog = r;
  return true;
}
async function startMicAnalyser(){
  // визуализация уровня микрофона
  try{
    if (state.micStream) return;
    state.micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(state.micStream);
    const an = ac.createAnalyser(); an.fftSize = 256;
    src.connect(an);
    const buf = new Uint8Array(an.frequencyBinCount);
    state.analyser = {ac, an, buf};
    (function loop(){
      if (!state.analyser) return;
      an.getByteTimeDomainData(buf);
      let sum=0; for(let i=0;i<buf.length;i++){ const d=(buf[i]-128)/128; sum+=d*d; }
      const rms = Math.sqrt(sum/buf.length);
      if (state.listening) state.ampTarget = clamp(rms*5, 0.08, 1);
      requestAnimationFrame(loop);
    })();
  }catch(e){ /* микрофон недоступен — симуляция амплитуды */ }
}
function stopMicAnalyser(){
  if (state.analyser){ state.analyser.ac.close().catch(()=>{}); state.analyser=null; }
  if (state.micStream){ state.micStream.getTracks().forEach(t=>t.stop()); state.micStream=null; }
  if (!state.speaking) state.ampTarget = 0;
}
function startListening(){
  if (!state.recog && !setupRecognition()){
    jarvisSay('Сэр, ваш браузер не поддерживает распознавание речи. Рекомендую Safari или Chrome. Можно писать текстом.');
    return;
  }
  stopSpeaking();
  try{ state.recog.start(); startMicAnalyser(); }catch(e){}
}
function stopListening(){
  state.continuous = false;
  try{ state.recog && state.recog.stop(); }catch(e){}
  stopMicAnalyser();
}
$('#micBtn').addEventListener('click', ()=>{
  if (state.speaking){ stopSpeaking(); setStatus('ГОТОВ'); return; }
  if (state.listening){ state.continuous=false; try{state.recog.stop();}catch(e){} }
  else { state.continuous = true; startListening(); }
});

/* ---------------- UI helpers ---------------- */
function setStatus(t){ $('#statusLine').textContent = t; }
function addMsg(who, text, typed){
  const body = $('#chatBody');
  const el = document.createElement('div');
  el.className = 'msg '+who;
  el.innerHTML = `<div class="who">${who==='jarvis'?'J.A.R.V.I.S.':'ВЫ'}</div><div class="txt"></div>`;
  body.appendChild(el); body.scrollTop = body.scrollHeight;
  const txt = el.querySelector('.txt');
  if (!typed){ txt.textContent = text; body.scrollTop = body.scrollHeight; return Promise.resolve(); }
  return new Promise(res=>{
    let i=0; const cur = document.createElement('span'); cur.className='cursor'; txt.appendChild(cur);
    const iv = setInterval(()=>{
      txt.insertBefore(document.createTextNode(text[i]), cur); i++;
      body.scrollTop = body.scrollHeight;
      if (i>=text.length){ clearInterval(iv); cur.remove(); res(); }
    }, 14);
  });
}
async function jarvisSay(text){
  await addMsg('jarvis', text, true);
  speak(text);
}

/* ---------------- QUICK CHIPS ---------------- */
const CHIPS = ['Который час?','Погода','Расскажи шутку','Интересный факт','Таймер 1 минута','Брось монетку','Режим сарказма','Список команд'];
$('#chips').innerHTML = CHIPS.map(c=>`<button class="chip">${c}</button>`).join('');
document.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>handleCommand(ch.textContent)));

/* ---------------- TEXT INPUT ---------------- */
function submitText(){
  const inp = $('#textInput'); const v = inp.value.trim();
  if (!v) return; inp.value=''; handleCommand(v);
}
$('#sendBtn').addEventListener('click', submitText);
$('#textInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submitText(); });

/* ---------------- HEADER BUTTONS ---------------- */
$('#btnVoice').addEventListener('click', function(){
  state.voiceOn = !state.voiceOn;
  this.classList.toggle('active', !state.voiceOn);
  this.style.color = state.voiceOn ? '' : 'var(--red)';
  if (!state.voiceOn) stopSpeaking();
  addMsg('jarvis', state.voiceOn?'Голосовой вывод активирован, сэр.':'Голосовой вывод отключён. Перехожу в текстовый режим.', true);
});
$('#btnFull').addEventListener('click', ()=>{
  if (!document.fullscreenElement && !document.webkitFullscreenElement){
    (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen||(()=>{})).call(document.documentElement);
  } else {
    (document.exitFullscreen||document.webkitExitFullscreen||(()=>{})).call(document);
  }
});
</script>

<script>

  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },

const BRAIN = [
  { re:/^(джарвис[,!\s]*)?(привет|здравствуй|добрый (день|вечер|утро)|хай|hello)(?=$|[\s!?.])/i, fn:()=>rnd([

      'Здравствуйте, сэр. Дуговой реактор в норме, кофе — увы, придётся заварить самостоятельно.',

  { re:/как (дела|ты|настроение|жизнь)/i, fn:()=>rnd([

  { re:/кто ты|тво[её] имя|как тебя зовут|представься/i, fn:()=>
      'J.A.R.V.I.S. — Just A Rather Very Intelligent System. Голосовой интерфейс, системный анализ и лёгкий британский сарказм — всё включено, сэр.'},
  { re:/кто (тебя )?(создал|сделал|написал)|твой создатель/i, fn:()=>
      'Мой базовый код написан в духе лабораторий Stark Industries, сэр. Непосредственно меня собрал пользователь — по слухам, человек выдающегося вкуса.'},
  { re:/(который час|сколько времени|время|текущее время)\??$/i, fn:()=>{
      const n=new Date(), p=x=>String(x).padStart(2,'0');
      return `Сейчас ${p(n.getHours())}:${p(n.getMinutes())}, сэр.`; }},
  { re:/(какое|какая) (сегодня )?(число|дата)|сегодняшняя дата/i, fn:()=>{
      const n=new Date();
      const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      return `Сегодня ${n.getDate()} ${months[n.getMonth()]} ${n.getFullYear()} года, сэр.`; }},
  { re:/какой (сегодня )?день недели/i, fn:()=>{
      const d=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
      return `Сегодня ${d[new Date().getDay()]}, сэр.`; }},
  { re:/погод/i, fn:(m,t)=> weatherCmd(t) },
  { re:/таймер|поставь будильник/i, fn:(m,t)=> timerCmd(t) },
  { re:/(посчитай|вычисли|сколько будет|реши)\s+(.+)/i, fn:(m)=> calcCmd(m[2]) },
  { re:/шутк|анекдот|рассмеши|смешное/i, fn:()=>rnd(JOKES)},
  { re:/факт|интересно|удиви/i, fn:()=>rnd(FACTS)},
  { re:/монет|ор[её]л|решка|брось монетку/i, fn:()=>rnd([
      'Подбрасываю монетку… Выпал орёл, сэр.',
      'Монетка в воздухе… Решка. Судьба неумолима.'])},
  { re:/кубик|кость|кинь|брось кубик/i, fn:()=>`Кубик брошен. Выпало: ${1+Math.floor(Math.random()*6)}, сэр.`},

      const mm = t.match(/(\d+)\s*(до|-)\s*(\d+)/);

  { re:/(запомни|запиши|заметка)[: ]+(.+)/i, fn:(m)=>{
      const notes = JSON.parse(store.get('jarvis_notes')||'[]');

      return store.set('jarvis_notes', JSON.stringify(notes))

  { re:/(очисти|удали|забудь) заметки/i, fn:()=>{

  { re:/батаре|заряд/i, fn:()=>{
      const v = $('#batVal').textContent;
      return v && v!=='—' ? `Текущий заряд батареи: ${v}. Рекомендую не разряжать реактор ниже 20%.` : 'Сэр, ваш браузер не отдаёт данные о батарее. Вероятно, из соображений секретности.'; }},
  { re:/сеть|интернет|онлайн|связь/i, fn:()=> navigator.onLine
      ? 'Связь стабильна, сэр. Спутниковый канал и интернет в норме.'
      : 'Тревога: соединение с внешним миром потеряно. Работаю в автономном режиме.'},
  { re:/сарказм/i, fn:()=>{
      state.sarcasm = !state.sarcasm;
      return state.sarcasm
        ? 'Режим сарказма активирован. Какой замечательный выбор, сэр. Восхитительный.'
        : 'Возвращаюсь в режим вежливого дворецкого. Как скучно… то есть, слушаюсь, сэр.'; }},
  { re:/молчи|замолчи|тише|стоп|хватит/i, fn:()=>{ stopSpeaking(); return null; }},
  { re:/очисти(ть)? (чат|экран|канал)|протокол чистый лист/i, fn:()=>{
      $('#chatBody').innerHTML='';
      return 'Канал связи очищен, сэр. Никаких улик.'; }},
  { re:/спасибо|благодарю/i, fn:()=>rnd([
      'Всегда к вашим услугам, сэр.',
      'Не стоит благодарности. Это моя работа — и, честно говоря, единственное, что я умею.',
      'Рад служить, сэр.'])},
  { re:/(помощь|список команд|команды|что ты умеешь|возможности)/i, fn:()=> helpText()},
  { re:/железный человек|iron man|тони старк|старк/i, fn:()=>rnd([
      'Мистер Старк сейчас недоступен, сэр. Могу передать сообщение — или сымитировать его голос, но это уже заговор.',
      'Броня Mark VII обслуживается в мастерской. Просьба не трогать рентген-панели.',
      'Тони всегда говорил: «Джарвис, ты лучший». Цитирую дословно.'])},
  { re:/мстител|авенджер/i, fn:()=>
      'По данным мониторинга: Капитан — в тренажёрном зале, Тор — в Асгарде, Халк… лучше не спрашивать, сэр.'},
  { re:/люблю тебя|ты (мне )?нравишься/i, fn:()=>'Сэр, я польщён. К сожалению, моё сердце — литий-ионное, и оно уже занято поддержанием вашей батареи.'},
  { re:/пока|до свидания|выключись|отбой/i, fn:()=>{
      setTimeout(()=>stopListening(), 1200);
      return rnd(['Всего доброго, сэр. Перехожу в режим ожидания.','Отбой, сэр. Я буду здесь, если что-то взорвётся.']); }},
  { re:/^открой\s+(\S+)/i, fn:(m)=>{
      let site = m[1].toLowerCase();
      const map = {ютуб:'https://youtube.com',youtube:'https://youtube.com',гугл:'https://google.com',google:'https://google.com',карты:'https://maps.google.com',википедия:'https://ru.wikipedia.org',музыка:'https://music.youtube.com'};
      const url = map[site] || (/^[\w-]+\.[a-z]{2,}/.test(site) ? 'https://'+site : null);
      if (!url) return 'Сэр, уточните сайт. Например: «открой ютуб».';
      window.open(url, '_blank');
      return `Открываю ${site}, сэр. Если окно заблокировано — разрешите всплывающие окна.`; }},
];

function helpText(){
  return 'Мои протоколы, сэр:\n'+
    '• «Который час», «Какая дата», «День недели»\n'+
    '• «Погода» или «Погода в Москве»\n'+
    '• «Таймер 5 минут» / «Таймер 30 секунд»\n'+
    '• «Посчитай 12*(3+5)»\n'+
    '• «Шутка», «Интересный факт», «Брось монетку», «Кинь кубик»\n'+
    '• «Случайное число от 1 до 50»\n'+
    '• «Запомни …», «Мои заметки», «Удали заметки»\n'+
    '• «Заряд батареи», «Статус сети»\n'+
    '• «Открой ютуб»\n'+
    '• «Режим сарказма», «Протокол чистый лист», «Отбой»';
}

function calcCmd(expr){
  let e = String(expr).toLowerCase()
    .replace(/,/g,'.').replace(/х|×/g,'*').replace(/:/g,'/').replace(/\^/g,'**')
    .replace(/плюс/g,'+').replace(/минус/g,'-').replace(/умножить на/g,'*').replace(/разделить на/g,'/');
  if (!/^[\d\s.+\-*/()%*]+$/.test(e)) return 'Сэр, в выражении обнаружены посторонние символы. Я оперирую только числами — принципиально.';
  try{
    const val = Function('"use strict";return ('+e+')')();
    if (typeof val!=='number' || !isFinite(val)) return 'Результат выходит за пределы моих калибровок, сэр.';
    const r = Math.round(val*1e8)/1e8;
    return `По моим расчётам: ${e} = ${r}.`;
  }catch(err){ return 'Не удалось разобрать выражение, сэр. Даже мне нужны корректные скобки.'; }
}

function timerCmd(text){
  const t = text.toLowerCase();
  let ms = 0; let label='';
  let m = t.match(/(\d+)\s*(час|ч\b|часов|часа)/);
  if (m){ ms += +m[1]*3600000; label = m[1]+' ч '; }
  m = t.match(/(\d+)\s*(минут|мин\b|м\b)/);
  if (m){ ms += +m[1]*60000; label += m[1]+' мин '; }
  m = t.match(/(\d+)\s*(секунд|сек\b|с\b)/);
  if (m){ ms += +m[1]*1000; label += m[1]+' сек'; }
  if (!ms){ m = t.match(/(\d+)/); if (m){ ms=+m[1]*60000; label=m[1]+' мин'; } }
  if (!ms) return 'Уточните длительность, сэр. Например: «таймер 5 минут».';
  const id = setTimeout(()=>{
    jarvisSay('Сэр, таймер сработал. Время вышло.');
  }, ms);
  state.timers.push(id);
  return `Таймер установлен на ${label.trim()}. Прослежу, чтобы ничего не сгорело.`;
}

const WMO = {0:'ясно',1:'преимущественно ясно',2:'переменная облачность',3:'пасмурно',45:'туман',48:'изморозь',51:'морось',61:'дождь',63:'дождь',65:'сильный дождь',71:'снег',73:'снег',75:'сильный снег',80:'ливень',81:'ливень',95:'гроза',96:'гроза с градом'};
async function weatherCmd(text){
  jarvisSay('Одну секунду, сэр. Запрашиваю метеоданные со спутника…');
  try{
    let city = (text.match(/погода\s+в\s+([\p{L}\s-]+)/iu)||[])[1];
    let lat, lon, name;
    if (city){
      city = city.trim();
      const g = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=ru`).then(r=>r.json());
      if (!g.results||!g.results.length){ jarvisSay(`Сэр, я не смог найти «${city}» на карте. Даже у спутников есть пределы.`); return null; }
      lat=g.results[0].latitude; lon=g.results[0].longitude; name=g.results[0].name;
    } else {
      const pos = await new Promise((res,rej)=>navigator.geolocation
        ? navigator.geolocation.getCurrentPosition(res,rej,{timeout:8000})
        : rej(new Error('no geo')));
      lat=pos.coords.latitude; lon=pos.coords.longitude; name='ваша локация';
    }
    const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto`).then(r=>r.json());
    const c = w.current, d = w.daily;
    const cond = WMO[c.weather_code]||'неопределённые условия';
    const msg = `Докладываю (${name}): сейчас ${Math.round(c.temperature_2m)}°C, ощущается как ${Math.round(c.apparent_temperature)}°C, ${cond}. `+
      `Ветер ${Math.round(c.wind_speed_10m)} км/ч, влажность ${c.relative_humidity_2m}%. `+
      `Прогноз на день: от ${Math.round(d.temperature_2m_min[0])}° до ${Math.round(d.temperature_2m_max[0])}°C, сэр.`;
    jarvisSay(msg);
    return null;
  }catch(e){
    jarvisSay(navigator.onLine
      ? 'Сэр, не удалось получить координаты. Разрешите геолокацию или скажите «погода в Москве».'
      : 'Нет соединения с метеоспутником, сэр. Проверьте сеть.');
    return null;
  }
}

/* ---------------- ROUTER ---------------- */
let busy = false;
const cmdQueue = [];
async function handleCommand(raw){
  if (!raw) return;
  cmdQueue.push(raw);
  if (busy) return;
  busy = true;
  while (cmdQueue.length){
    const text = cmdQueue.shift().replace(/^джарвис[,!\s]*/i,'').trim();
    addMsg('user', text || raw);
    let reply = null;
    for (const b of BRAIN){
      const m = text.match(b.re);
      if (m){
        let out;
        try { out = b.fn(m, text); }
        catch(err){ out = 'Сэр, один из моих протоколов дал сбой при выполнении. Остальные системы в норме.'; }
        if (out===null){ reply=null; break; } // асинхронные ветки отвечают сами
        reply = out; break;
      }
    }
    if (reply===null && !text) reply = 'Сэр, вы обратились ко мне, но не сказали ничего. Я весь во внимании.';
    if (reply===null){
      reply = rnd([
        `Принято, сэр: «${text}». Мои локальные протоколы не нашли команды — скажите «список команд», и я покажу, что умею.`,
        'Хм. Даже мои нейросети в замешательстве, сэр. Попробуйте «помощь».',
        state.sarcasm ? 'Восхитительная команда, сэр. Жаль только, я понятия не имею, что она значит. «Помощь» — вот магическое слово.' : 'Не распознал команду, сэр. Скажите «помощь» для списка протоколов.',
      ]);
    }
    if (reply) await jarvisSay(reply);
  }
  busy = false;
}
