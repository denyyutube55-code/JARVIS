<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050810">
<title>J.A.R.V.I.S. — Stark Industries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050810; --panel:rgba(12,18,32,.82); --panel2:rgba(17,26,43,.9);
  --border:#1a2540; --border-glow:rgba(34,211,238,.35);
  --cyan:#22d3ee; --cyan-dim:rgba(34,211,238,.55);
  --amber:#fbbf24; --red:#f87171; --green:#34d399; --purple:#a78bfa;
  --text:#cfe6f5; --muted:#5b7a99;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --sans:'Inter',-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--mono);
  overflow:hidden; height:100dvh;
  background-image:
    radial-gradient(1200px 700px at 70% -10%, rgba(34,211,238,.07), transparent 60%),
    radial-gradient(900px 600px at 10% 110%, rgba(251,191,36,.05), transparent 60%);
}
body::after{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:60;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:59;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55));
}

/* ============ BOOT ============ */
#boot{
  position:fixed; inset:0; z-index:100; background:#02040a;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:26px; padding:24px; transition:opacity .8s ease;
}
#boot.off{opacity:0; pointer-events:none}
#boot .logo{width:120px;height:120px;animation:bootPulse 2.2s ease-in-out infinite}
@keyframes bootPulse{0%,100%{filter:drop-shadow(0 0 18px rgba(34,211,238,.5))}50%{filter:drop-shadow(0 0 40px rgba(34,211,238,.9))}}
#bootLog{width:min(520px,90vw);height:150px;overflow:hidden;font-size:11px;line-height:1.7;color:var(--cyan-dim);letter-spacing:.05em;text-transform:uppercase}
#bootLog div{opacity:0;animation:bootLine .3s forwards}
@keyframes bootLine{to{opacity:1}}
#bootStart{
  font-family:var(--mono); font-size:13px; letter-spacing:.3em; text-transform:uppercase;
  color:var(--cyan); background:transparent; border:1px solid var(--border-glow);
  padding:16px 42px; min-height:44px; cursor:pointer;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  transition:background .2s, color .2s;
}
#bootStart:active,#bootStart:hover{background:var(--cyan); color:#04121a}

/* ============ LAYOUT ============ */
#app{
  height:100dvh; display:grid; grid-template-rows:auto 1fr auto;
  opacity:0; transition:opacity 1s ease .2s;
  padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  gap:10px;
}
#app.on{opacity:1}

header{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  border:1px solid var(--border); background:var(--panel);
  padding:10px 16px; backdrop-filter:blur(8px);
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
}
.brand{font-weight:700; letter-spacing:.28em; font-size:13px; color:var(--cyan)}
.brand small{color:var(--muted); letter-spacing:.18em; font-weight:300; font-size:9px; display:block}
.leds{display:flex; gap:8px; margin-left:6px}
.led{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulseDot 1.5s ease-in-out infinite}
.led.amber{background:var(--amber);box-shadow:0 0 8px var(--amber);animation-delay:.4s}
.led.cyan{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation-delay:.8s}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}
.head-spacer{flex:1}
.head-item{font-size:10px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; text-align:right}
.head-item b{display:block; color:var(--text); font-size:13px; letter-spacing:.08em; font-weight:500}
.live-badge{display:flex; align-items:center; gap:7px; font-size:10px; letter-spacing:.2em; color:var(--green); text-transform:uppercase}
.live-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulseDot 1.4s infinite}
.icon-btn{
  background:transparent; border:1px solid var(--border); color:var(--muted);
  width:44px; height:44px; cursor:pointer; display:grid; place-items:center;
  transition:color .15s,border-color .15s;
}
.icon-btn:hover,.icon-btn.active{color:var(--cyan); border-color:var(--border-glow)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

main{display:grid; grid-template-columns:300px 1fr 400px; gap:10px; min-height:0}
.panel{
  border:1px solid var(--border); background:var(--panel);
  backdrop-filter:blur(8px); display:flex; flex-direction:column; min-height:0;
  position:relative; overflow:hidden;
}
.panel-title{
  font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted);
  padding:12px 14px 10px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:8px; flex-shrink:0;
}
.panel-title::before{content:''; width:6px; height:6px; background:var(--cyan); box-shadow:0 0 6px var(--cyan)}
.panel-title .right{margin-left:auto; color:var(--cyan-dim); letter-spacing:.1em}

#sysBody{padding:12px 14px; display:flex; flex-direction:column; gap:14px; overflow-y:auto}
.gauge-block{display:flex; flex-direction:column; gap:6px}
.gauge-head{display:flex; justify-content:space-between; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
.gauge-head b{color:var(--cyan); font-weight:500; font-size:11px}
.gauge-canvas{width:100%; height:44px; display:block}
.bar-row{display:flex; align-items:center; gap:10px; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.bar-row span{width:64px; flex-shrink:0}
.bar{flex:1; height:4px; background:rgba(34,211,238,.1); position:relative; overflow:hidden}
.bar i{position:absolute; inset:0; right:auto; background:var(--cyan); box-shadow:0 0 8px var(--cyan-dim); transition:width .6s ease}
.bar-row b{width:44px; text-align:right; color:var(--text); font-weight:500; font-size:10px}
#diagLog{font-size:9.5px; line-height:1.8; color:var(--muted); letter-spacing:.05em; text-transform:uppercase}
#diagLog .ok{color:var(--green)} #diagLog .warn{color:var(--amber)} #diagLog .err{color:var(--red)}

/* ---- DEVICE HUB ---- */
#deviceGrid{
  display:grid; grid-template-columns:repeat(2,1fr); gap:8px;
}
.dev-btn{
  background:rgba(6,12,24,.6); border:1px solid var(--border); color:var(--muted);
  font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase;
  padding:10px 6px; min-height:44px; cursor:pointer; display:flex;
  flex-direction:column; align-items:center; gap:5px;
  transition:all .2s; position:relative;
}
.dev-btn .ic{font-size:16px; line-height:1; filter:grayscale(.6); transition:filter .2s}
.dev-btn:hover{border-color:var(--border-glow); color:var(--cyan-dim)}
.dev-btn.on{color:var(--cyan); border-color:var(--cyan); background:rgba(34,211,238,.08); box-shadow:inset 0 0 12px rgba(34,211,238,.15)}
.dev-btn.on .ic{filter:none}
.dev-btn.on::after{
  content:''; position:absolute; top:5px; right:5px; width:5px; height:5px;
  border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green);
}
.dev-btn.denied{color:var(--red); border-color:rgba(248,113,113,.5)}

/* ---- CENTER ---- */
#center{align-items:center; justify-content:center; background:transparent; border:none; backdrop-filter:none}
#reactorWrap{position:relative; width:min(52vh,88vw,460px); aspect-ratio:1}
#reactor{width:100%; height:100%; display:block}
#micBtn{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:96px; height:96px; border-radius:50%; cursor:pointer;
  background:radial-gradient(circle at 35% 30%, rgba(34,211,238,.25), rgba(6,12,24,.9) 70%);
  border:1px solid var(--border-glow); color:var(--cyan);
  display:grid; place-items:center; transition:box-shadow .25s, transform .15s;
  box-shadow:0 0 30px rgba(34,211,238,.25), inset 0 0 24px rgba(34,211,238,.15);
}
#micBtn:active{transform:translate(-50%,-50%) scale(.94)}
#micBtn.listening{box-shadow:0 0 55px rgba(34,211,238,.7), inset 0 0 30px rgba(34,211,238,.35); animation:micGlow 1.2s ease-in-out infinite}
@keyframes micGlow{0%,100%{box-shadow:0 0 40px rgba(34,211,238,.5)}50%{box-shadow:0 0 70px rgba(34,211,238,.95)}}
#micBtn svg{width:34px; height:34px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
#statusLine{
  position:absolute; left:50%; transform:translateX(-50%); bottom:-8px;
  font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:var(--cyan-dim);
  white-space:nowrap; text-shadow:0 0 12px rgba(34,211,238,.5);
}
#centerCaption{
  position:absolute; top:6px; left:50%; transform:translateX(-50%);
  font-size:9px; letter-spacing:.3em; color:var(--muted); text-transform:uppercase; white-space:nowrap;
}

/* ---- COMMS ---- */
#chatBody{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; min-height:0}
.msg{max-width:92%; font-family:var(--sans); font-size:13.5px; line-height:1.55; animation:msgIn .35s ease both}
@keyframes msgIn{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.msg .who{font-family:var(--mono); font-size:8.5px; letter-spacing:.22em; text-transform:uppercase; margin-bottom:4px; color:var(--muted)}
.msg.jarvis{align-self:flex-start; border-left:2px solid var(--cyan); padding-left:12px; color:var(--text)}
.msg.jarvis .who{color:var(--cyan)}
.msg.user{align-self:flex-end; border-right:2px solid var(--amber); padding-right:12px; text-align:right; color:#f3e9d2}
.msg.user .who{color:var(--amber)}
.msg .txt{white-space:pre-wrap}
.msg .cursor{display:inline-block; width:7px; height:13px; background:var(--cyan); vertical-align:-2px; animation:blink .7s steps(1) infinite; margin-left:2px}
@keyframes blink{50%{opacity:0}}
#chips{display:flex; gap:8px; padding:10px 14px; overflow-x:auto; flex-shrink:0; border-top:1px solid var(--border); scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
  color:var(--cyan-dim); background:rgba(34,211,238,.06); border:1px solid var(--border);
  padding:9px 14px; min-height:44px; cursor:pointer; text-transform:uppercase;
  transition:color .15s,border-color .15s; white-space:nowrap;
}
.chip:hover{color:var(--cyan); border-color:var(--border-glow)}
#inputRow{display:flex; gap:8px; padding:0 14px 14px; flex-shrink:0}
#textInput{
  flex:1; background:rgba(6,12,24,.9); border:1px solid var(--border); color:var(--text);
  font-family:var(--mono); font-size:13px; padding:0 14px; min-height:44px; outline:none;
}
#textInput:focus{border-color:var(--border-glow); box-shadow:0 0 14px rgba(34,211,238,.15)}
#textInput::placeholder{color:var(--muted)}
#sendBtn{
  background:rgba(34,211,238,.1); border:1px solid var(--border-glow); color:var(--cyan);
  font-family:var(--mono); font-size:11px; letter-spacing:.18em; padding:0 20px;
  min-height:44px; cursor:pointer; text-transform:uppercase; transition:background .15s;
}
#sendBtn:hover{background:rgba(34,211,238,.22)}

/* ---- TICKER ---- */
#ticker{border:1px solid var(--border); background:var(--panel); overflow:hidden; height:30px; display:flex; align-items:center; flex-shrink:0}
#tickerTrack{
  display:inline-flex; gap:48px; white-space:nowrap; font-size:9.5px;
  letter-spacing:.2em; text-transform:uppercase; color:var(--muted);
  animation:tick 48s linear infinite; padding-left:100%;
}
#tickerTrack b{color:var(--cyan-dim); font-weight:500}
@keyframes tick{to{transform:translateX(-100%)}}

/* ---- MODAL ---- */
#modal{
  position:fixed; inset:0; z-index:80; background:rgba(2,4,10,.85);
  backdrop-filter:blur(8px); display:grid; place-items:center; padding:20px;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
#modal.on{opacity:1; pointer-events:auto}
.modal-inner{
  max-width:min(640px,94vw); max-height:88vh; width:100%;
  border:1px solid var(--border-glow); background:var(--panel2);
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  display:flex; flex-direction:column; overflow:hidden;
}
.modal-head{
  padding:12px 16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px;
  font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--cyan);
}
.modal-head .modal-close{
  margin-left:auto; background:transparent; border:1px solid var(--border);
  color:var(--muted); width:34px; height:34px; cursor:pointer; font-size:16px;
}
.modal-head .modal-close:hover{color:var(--red); border-color:var(--red)}
.modal-body{padding:16px; overflow-y:auto; color:var(--text); font-size:13px; line-height:1.6; font-family:var(--sans)}
.modal-body pre, .modal-body code{
  font-family:var(--mono); font-size:11.5px; background:rgba(6,12,24,.8);
  padding:10px; border-left:2px solid var(--cyan); display:block; overflow-x:auto;
  white-space:pre-wrap; word-break:break-word;
}
.modal-body video, .modal-body img{max-width:100%; border:1px solid var(--border); display:block}
.modal-body .row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.modal-body button{
  background:rgba(34,211,238,.1); border:1px solid var(--border-glow); color:var(--cyan);
  font-family:var(--mono); font-size:10px; letter-spacing:.15em; padding:10px 16px;
  cursor:pointer; text-transform:uppercase;
}
.modal-body button:hover{background:rgba(34,211,238,.22)}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1a2540; border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--cyan-dim)}

/* ---- TOAST ---- */
#toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-40px);
  background:var(--panel2); border:1px solid var(--border-glow); color:var(--cyan);
  padding:10px 18px; font-size:10px; letter-spacing:.15em; text-transform:uppercase;
  z-index:90; opacity:0; transition:all .3s; pointer-events:none;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

@media (max-width:1023px){
  body{overflow:auto}
  #app{height:auto; min-height:100dvh; grid-template-rows:auto auto auto}
  main{grid-template-columns:1fr}
  #center{order:-1; padding:18px 0 26px}
  #reactorWrap{width:min(58vw,320px)}
  #left{max-height:380px}
  #chatBody{min-height:260px; max-height:44vh}
  .head-item.hide-m{display:none}
}
@media (max-width:430px){
  .brand{font-size:11px}
  #micBtn{width:80px;height:80px}
  #micBtn svg{width:28px;height:28px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s !important; animation-iteration-count:1 !important; transition-duration:.01s !important}
}
</style>
</head>
<body>

<!-- ================= BOOT ================= -->
<div id="boot">
  <svg class="logo" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="none" stroke="#22d3ee" stroke-width="1" opacity=".35"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8 5" opacity=".7"/>
    <circle cx="50" cy="50" r="26" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".9"/>
    <circle cx="50" cy="50" r="14" fill="#22d3ee" opacity=".9"/>
    <circle cx="50" cy="50" r="14" fill="none" stroke="#fff" stroke-width="1" opacity=".8"/>
  </svg>
  <div id="bootLog"></div>
  <button id="bootStart">Запуск системы</button>
</div>

<!-- ================= TOAST ================= -->
<div id="toast"></div>

<!-- ================= MODAL ================= -->
<div id="modal">
  <div class="modal-inner">
    <div class="modal-head">
      <span id="modalTitle">J.A.R.V.I.S.</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <header>
    <div class="brand">J.A.R.V.I.S.<small>STARK INDUSTRIES · MARK VII</small></div>
    <div class="leds"><div class="led"></div><div class="led amber"></div><div class="led cyan"></div></div>
    <div class="head-spacer"></div>
    <div class="head-item">Система<b id="hStatus">ОНЛАЙН</b></div>
    <div class="head-item hide-m">Время<b id="hClock">--:--:--</b></div>
    <div class="head-item hide-m">Дата<b id="hDate">—</b></div>
    <div class="live-badge">Мониторинг</div>
    <button class="icon-btn" id="btnVoice" title="Голос вкл/выкл">
      <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <button class="icon-btn" id="btnFull" title="Во весь экран">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
  </header>

  <main>
    <section class="panel" id="left">
      <div class="panel-title">Диагностика систем<span class="right">SYS.01</span></div>
      <div id="sysBody">
        <div class="gauge-block">
          <div class="gauge-head"><span>Ядро реактора</span><b id="cpuVal">0%</b></div>
          <canvas class="gauge-canvas" id="cpuCanvas"></canvas>
        </div>
        <div class="gauge-block">
          <div class="gauge-head"><span>Нейросеть</span><b id="ramVal">0%</b></div>
          <canvas class="gauge-canvas" id="ramCanvas"></canvas>
        </div>
        <div class="bar-row"><span>Батарея</span><div class="bar"><i id="batBar" style="width:0%"></i></div><b id="batVal">—</b></div>
        <div class="bar-row"><span>Сеть</span><div class="bar"><i id="netBar" style="width:0%"></i></div><b id="netVal">—</b></div>
        <div class="bar-row"><span>Мощность</span><div class="bar"><i id="powBar" style="width:0%"></i></div><b id="powVal">—</b></div>

        <div class="panel-title" style="border-top:1px solid var(--border); border-bottom:none; padding-left:0">Пульт устройства<span class="right">HUB</span></div>
        <div id="deviceGrid"></div>

        <div class="panel-title" style="border-top:1px solid var(--border); border-bottom:none; padding-left:0">Журнал<span class="right">LOG</span></div>
        <div id="diagLog"></div>
      </div>
    </section>

    <section class="panel" id="center">
      <div id="reactorWrap">
        <div id="centerCaption">ARC REACTOR · ГОЛОСОВОЕ ЯДРО</div>
        <canvas id="reactor"></canvas>
        <button id="micBtn" title="Говорить">
          <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>
        </button>
        <div id="statusLine">ИНИЦИАЛИЗАЦИЯ…</div>
      </div>
    </section>

    <section class="panel" id="right">
      <div class="panel-title">Канал связи<span class="right">COMMS</span></div>
      <div id="chatBody"></div>
      <div id="chips"></div>
      <div id="inputRow">
        <input id="textInput" type="text" placeholder="Введите команду, сэр…" autocomplete="off" enterkeyhint="send">
        <button id="sendBtn">Отпр.</button>
      </div>
    </section>
  </main>

  <div id="ticker"><div id="tickerTrack"></div></div>
</div>

<script>
'use strict';
/* ============================================================
   БАЗОВОЕ СОСТОЯНИЕ
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const state = {
  voiceOn: true, listening: false, speaking: false, continuous: false,
  amp: 0, ampTarget: 0, sarcasm: false, recog: null, voices: [],
  timers: [], analyser: null, micStream: null, stopwatch: null,
};

/* ============================================================
   ЗВУКОВЫЕ ЭФФЕКТЫ (Web Audio)
   ============================================================ */
const SFX = (()=>{
  let ctx = null;
  function ac(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; }
  function beep(freq=880, dur=0.08, type='sine', vol=0.05){
    const c = ac(); if(!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
    o.connect(g).connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
  }
  return {
    click(){ beep(1200, 0.03, 'square', 0.03); },
    ok(){ beep(880,0.06); setTimeout(()=>beep(1320,0.09),70); },
    warn(){ beep(440,0.15,'sawtooth',0.05); },
    err(){ beep(220,0.2,'sawtooth',0.06); },
    ready(){ beep(660,0.05); setTimeout(()=>beep(880,0.05),60); setTimeout(()=>beep(1320,0.1),120); },
    timer(){ for(let i=0;i<3;i++) setTimeout(()=>beep(1600,0.1,'square',0.08), i*250); },
  };
})();

   DEVICE HUB — управление устройством

const Hub = {
  wakeSentinel: null,
  flags: { wake:false, notify:false, haptic:true, sfx:true },
  init(){
    this.flags.wake = false;
    this.flags.notify = ('Notification' in window) && Notification.permission === 'granted';
    this.flags.haptic = store.get('haptic', true);
    this.flags.sfx = store.get('sfx', true);
    if (this.flags.sfx === false) { /* sfx всё равно доступен, но тише */ }
    this.render();
  },
  async toggle(key){
    if (key==='wake') return this.toggleWake();
    if (key==='notify') return this.toggleNotify();
    if (key==='haptic'){ this.flags.haptic = !this.flags.haptic; store.set('haptic', this.flags.haptic); this.render(); toast(this.flags.haptic?'Вибрация вкл.':'Вибрация выкл.'); return; }
    if (key==='sfx'){ this.flags.sfx = !this.flags.sfx; store.set('sfx', this.flags.sfx); this.render(); toast(this.flags.sfx?'Звук вкл.':'Звук выкл.'); return; }
    if (key==='camera'){ return Camera.open(); }
    if (key==='geo'){ return Geo.show(); }
    if (key==='torch'){ return Camera.toggleTorch(); }
    if (key==='clip'){ return Clipboard.readOut(); }
    if (key==='screen'){ return ScreenRec.toggle(); }
    if (key==='mic'){ return startListening(); }
  },
  async toggleWake(){
    try{
      if (this.wakeSentinel){ await this.wakeSentinel.release(); this.wakeSentinel=null; this.flags.wake=false; }
      else if ('wakeLock' in navigator){
        this.wakeSentinel = await navigator.wakeLock.request('screen');
        this.flags.wake = true;
        this.wakeSentinel.addEventListener('release',()=>{ this.flags.wake=false; this.render(); });
      } else { toast('Wake Lock не поддерживается'); return; }
      this.render();
      toast(this.flags.wake?'Экран будет активен':'Экран разблокирован');
    }catch(e){ toast('Ошибка Wake Lock'); }
  },
  async toggleNotify(){
    if (!('Notification' in window)){ toast('Уведомления не поддерживаются'); return; }
    if (Notification.permission === 'granted'){ this.flags.notify = !this.flags.notify; this.render(); return; }
    const p = await Notification.requestPermission();
    this.flags.notify = (p === 'granted');
    this.render();
    toast(this.flags.notify?'Уведомления включены':'Отказано');
  },
  notify(title, body){
    if (!this.flags.notify) return;
    try{ new Notification(title, {body, icon:''}); }catch(e){}
  },
  vibrate(pattern){
    if (!this.flags.haptic) return;
    try{ navigator.vibrate && navigator.vibrate(pattern); }catch(e){}
  },
  render(){
    const grid = $('#deviceGrid');
    const F = this.flags;
    const btns = [
      ['wake','🖥️','Экран', F.wake],
      ['notify','🔔','Уведом.', F.notify],
      ['haptic','📳','Вибрация', F.haptic],
      ['sfx','🔊','Звук', F.sfx],
      ['camera','📷','Камера', Camera.active],
      ['torch','🔦','Фонарь', Camera.torchOn],
      ['geo','📍','Гео', Geo.active],
      ['clip','📋','Буфер', false],
      ['screen','🎥','Запись', ScreenRec.active],
      ['mic','🎤','Микрофон', state.listening],
    ];
    grid.innerHTML = btns.map(([k,ic,label,on])=>
      `<button class="dev-btn ${on?'on':''}" data-k="${k}"><span class="ic">${ic}</span><span>${label}</span></button>`
    ).join('');
    grid.querySelectorAll('.dev-btn').forEach(b=>{
      b.addEventListener('click', ()=>{ SFX.click(); this.toggle(b.dataset.k); });
    });
  },
};
window.Hub = Hub;

const Camera = {
  stream: null, active: false, torchOn: false, track: null,
  async open(){
    try{
      if (this.active){ this.stop(); return; }
      this.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
      this.track = this.stream.getVideoTracks()[0];
      this.active = true;
      const caps = this.track.getCapabilities ? this.track.getCapabilities() : {};
      this.torchSupported = !!caps.torch;
      Hub.render();
      openModal('КАМЕРА · ВИДЕОКАНАЛ',
        `<video id="camV" autoplay playsinline muted style="width:100%"></video>
         <div class="row">
           <button id="camSnap">📸 Снимок</button>
           <button id="camTorch" ${this.torchSupported?'':'disabled style="opacity:.4"'}>🔦 Фонарь</button>
           <button id="camClose">Стоп</button>
         </div>`);
      $('#camV').srcObject = this.stream;
      $('#camClose').addEventListener('click',()=>{ this.stop(); closeModal(); });
      $('#camTorch').addEventListener('click',()=>this.toggleTorch());
      $('#camSnap').addEventListener('click',()=>this.snapshot());
    }catch(e){ toast('Камера недоступна'); SFX.err(); }
  },
  stop(){
    if (this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; }
    this.active = false; this.torchOn = false;
    Hub.render();
  },
  async toggleTorch(){
    if (!this.track) return;
    try{
      this.torchOn = !this.torchOn;
      await this.track.applyConstraints({ advanced:[{ torch: this.torchOn }] });
      Hub.render();
      toast(this.torchOn?'Фонарь включён':'Фонарь выключен');
    }catch(e){ toast('Фонарь недоступен'); }
  },
  snapshot(){
    const v = $('#camV'); if (!v) return;
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v,0,0);
    c.toBlob(b=>{
      const url = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href=url; a.download='jarvis_'+(Date.now())+'.png'; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),5000);
      toast('Снимок сохранён'); SFX.ok();
    },'image/png');
  }
};

const ScreenRec = {
  active:false, rec:null, chunks:[],
  async toggle(){
    if (this.active){
      try{ this.rec.stop(); }catch(e){}
      this.active = false; Hub.render(); toast('Запись остановлена');
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getDisplayMedia({ video:true, audio:true });
      this.rec = new MediaRecorder(stream);
      this.chunks = [];
      this.rec.ondataavailable = e=>{ if(e.data.size) this.chunks.push(e.data); };
      this.rec.onstop = ()=>{
        const blob = new Blob(this.chunks, {type:'video/webm'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href=url; a.download='jarvis_screen_'+Date.now()+'.webm'; a.click();
        setTimeout(()=>URL.revokeObjectURL(url),5000);
        stream.getTracks().forEach(t=>t.stop());
      };
      this.rec.start();
      this.active = true; Hub.render(); toast('Запись экрана начата'); SFX.ok();
    }catch(e){ toast('Отказано в доступе'); }
  }
};

function makeGraph(canvasId, valId, base, spread, color){
  const c = $(canvasId), ctx = c.getContext('2d');
  const data = Array.from({length:60},()=>base + (Math.random()-.5)*spread);
  function draw(){
    const dpr = window.devicePixelRatio||1;
    const w = c.clientWidth*dpr, h = c.clientHeight*dpr;
    if (c.width!==w||c.height!==h){ c.width=w; c.height=h; }
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle='rgba(26,37,64,.9)'; ctx.lineWidth=1;
    for(let y=0;y<=3;y++){ ctx.beginPath(); ctx.moveTo(0,h*y/3); ctx.lineTo(w,h*y/3); ctx.stroke(); }
    data.push(clamp(data[data.length-1]+(Math.random()-.5)*8, 8, 97)); data.shift();
    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,color.replace(')',',.35)').replace('rgb','rgba'));
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.moveTo(0,h);
    data.forEach((v,i)=>ctx.lineTo(i/(data.length-1)*w, h-(v/100)*h));
    ctx.lineTo(w,h); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
    ctx.beginPath();
    data.forEach((v,i)=>{const x=i/(data.length-1)*w,y=h-(v/100)*h; i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.strokeStyle=color; ctx.lineWidth=1.6*dpr; ctx.shadowColor=color; ctx.shadowBlur=6*dpr; ctx.stroke();
    ctx.shadowBlur=0;
    const cur = Math.round(data[data.length-1]);
    $(valId).textContent = cur+'%';
    return cur;
  }
  return draw;
}

const rc = $('#reactor'), rctx = rc.getContext('2d');
let rw=0, rh=0, cx=0, cy=0;
function sizeReactor(){
  const dpr = window.devicePixelRatio||1;
  rw = rc.clientWidth*dpr; rh = rc.clientHeight*dpr;
  rc.width=rw; rc.height=rh; cx=rw/2; cy=rh/2;
}
sizeReactor(); window.addEventListener('resize', sizeReactor);
const particles = Array.from({length:90},()=>({
  a:Math.random()*Math.PI*2, r:.35+Math.random()*.75, s:(Math.random()*.002+.0006)*(Math.random()<.5?-1:1),
  sz:Math.random()*2+0.6, o:Math.random()*.6+.2
}));
let rot=0;
function drawReactor(t){
  rctx.clearRect(0,0,rw,rh);
  const R = Math.min(rw,rh)/2*0.94;
  rot += 0.0035;
  state.amp += (state.ampTarget-state.amp)*0.12;
  const amp = state.amp;

  rctx.save(); rctx.translate(cx,cy); rctx.rotate(rot);
  rctx.strokeStyle='rgba(34,211,238,.5)'; rctx.lineWidth=1.4;
  for(let i=0;i<72;i++){
    const a=i/72*Math.PI*2, l=i%6===0?R*0.085:R*0.035;
    rctx.beginPath();
    rctx.moveTo(Math.cos(a)*R*0.97, Math.sin(a)*R*0.97);
    rctx.lineTo(Math.cos(a)*(R*0.97-l), Math.sin(a)*(R*0.97-l));
    rctx.stroke();
  }
  rctx.restore();

  rctx.save(); rctx.translate(cx,cy); rctx.rotate(-rot*1.7);
  rctx.setLineDash([R*0.09,R*0.045]); rctx.strokeStyle='rgba(34,211,238,.65)';
  rctx.lineWidth=2; rctx.beginPath(); rctx.arc(0,0,R*0.82,0,Math.PI*2); rctx.stroke();
  rctx.restore();
  rctx.save(); rctx.translate(cx,cy); rctx.rotate(rot*2.3);
  rctx.setLineDash([R*0.02,R*0.05]); rctx.strokeStyle='rgba(251,191,36,.45)';
  rctx.lineWidth=1.4; rctx.beginPath(); rctx.arc(0,0,R*0.72,0,Math.PI*2); rctx.stroke();
  rctx.restore();
  rctx.setLineDash([]);

  const sweep = rot*3;
  if (rctx.createConicGradient){
    const g2 = rctx.createConicGradient(sweep,cx,cy);
    g2.addColorStop(0,'rgba(34,211,238,.22)'); g2.addColorStop(0.12,'rgba(34,211,238,0)');
    g2.addColorStop(1,'rgba(34,211,238,0)');
    rctx.fillStyle=g2; rctx.beginPath(); rctx.moveTo(cx,cy); rctx.arc(cx,cy,R*0.68,0,Math.PI*2); rctx.fill();
  }

  rctx.save(); rctx.translate(cx,cy);
  rctx.beginPath();
  const seg=96;
  for(let i=0;i<=seg;i++){
    const a=i/seg*Math.PI*2;
    const w = Math.sin(a*7+t*0.006)*Math.sin(a*3-t*0.004);
    const rr = R*0.56 + w*R*0.1*(0.15+amp);
    const x=Math.cos(a)*rr, y=Math.sin(a)*rr;
    i?rctx.lineTo(x,y):rctx.moveTo(x,y);
  }
  rctx.closePath();
  rctx.strokeStyle=`rgba(34,211,238,${0.35+amp*0.6})`;
  rctx.lineWidth=1.6+amp*2;
  rctx.shadowColor='#22d3ee'; rctx.shadowBlur=12+amp*30; rctx.stroke();
  rctx.restore();

  particles.forEach(p=>{
    p.a+=p.s;
    const pr = R*p.r*0.66;
    const x=cx+Math.cos(p.a)*pr, y=cy+Math.sin(p.a)*pr;
    rctx.fillStyle=`rgba(34,211,238,${p.o*(0.4+amp*0.6)})`;
    rctx.beginPath(); rctx.arc(x,y,p.sz*(window.devicePixelRatio||1)*0.8,0,Math.PI*2); rctx.fill();
  });

  const core = R*0.2*(1+amp*0.35+Math.sin(t*0.004)*0.02);
  const cg = rctx.createRadialGradient(cx,cy,0,cx,cy,core*2.4);
  cg.addColorStop(0,'rgba(255,255,255,.95)');
  cg.addColorStop(0.25,'rgba(34,211,238,.85)');
  cg.addColorStop(0.6,'rgba(34,211,238,.18)');
  cg.addColorStop(1,'rgba(34,211,238,0)');
  rctx.fillStyle=cg; rctx.beginPath(); rctx.arc(cx,cy,core*2.4,0,Math.PI*2); rctx.fill();
  rctx.strokeStyle='rgba(255,255,255,.7)'; rctx.lineWidth=1.2;
  rctx.beginPath(); rctx.arc(cx,cy,core,0,Math.PI*2); rctx.stroke();

  requestAnimationFrame(drawReactor);
}

function loadVoices(){ state.voices = speechSynthesis.getVoices(); }
if ('speechSynthesis' in window){

}
function pickVoice(){
  const v = state.voices; if(!v) return null;
  return v.find(x=>/ru/i.test(x.lang) && /male|муж|Павел|Yuri|Dmitri/i.test(x.name))
      || v.find(x=>/ru/i.test(x.lang))
      || v.find(x=>/en-GB/i.test(x.lang))

}
function initAudioUnlock(){

}
function speak(text, onEnd){
  if (!state.voiceOn || !('speechSynthesis' in window)){ onEnd&&onEnd(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if (v) u.voice = v;
  u.lang = 'ru-RU'; u.rate = 1.02; u.pitch = 0.92;
  state.speaking = true; setStatus('ГОВОРЮ…');
  const ph = setInterval(()=>{ state.ampTarget = 0.4 + Math.random()*0.6; }, 130);
  u.onend = u.onerror = ()=>{
    clearInterval(ph); state.ampTarget = 0; state.speaking = false;
    setStatus(state.listening?'СЛУШАЮ…':'ГОТОВ');
    if (state.continuous && !state.listening) startListening();
    onEnd&&onEnd();
  };
  speechSynthesis.speak(u);
}
function stopSpeaking(){ if ('speechSynthesis' in window) speechSynthesis.cancel(); state.speaking=false; state.ampTarget=0; }

/* ============================================================
   ГОЛОС — распознавание
   ============================================================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function setupRecognition(){
  if (!SR) return false;
  const r = new SR();
  r.lang = 'ru-RU'; r.interimResults = true; r.continuous = false;
  r.onstart = ()=>{ state.listening = true; $('#micBtn').classList.add('listening'); setStatus('СЛУШАЮ…'); Hub.render(); };
  r.onresult = e=>{
    let interim='', final='';
    for (const res of e.results) (res.isFinal ? final+=res[0].transcript : interim+=res[0].transcript);
    if (interim) setStatus('«'+interim.trim().slice(0,42)+'…»');
    if (final){ handleCommand(final.trim()); }
  };
  r.onerror = e=>{
    stopListening();
    if (e.error==='not-allowed'||e.error==='service-not-allowed'){
      jarvisSay('Сэр, у меня нет доступа к микрофону. Проверьте разрешения в настройках браузера.');
    } else if (e.error==='network'){
      jarvisSay('Потеряна связь с сервером распознавания, сэр. Попробуйте ещё раз.');
    }
  };
  r.onend = ()=>{
    state.listening = false; $('#micBtn').classList.remove('listening');
    stopMicAnalyser(); Hub.render();
    if (!state.speaking) setStatus('ГОТОВ');
    if (state.continuous && !state.speaking) setTimeout(()=>{ if(state.continuous&&!state.listening) startListening(); }, 350);
  };
  state.recog = r;
  return true;
}
async function startMicAnalyser(){
  try{
    if (state.micStream) return;
    state.micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(state.micStream);
    const an = ac.createAnalyser(); an.fftSize = 256;
    src.connect(an);
    const buf = new Uint8Array(an.frequencyBinCount);
    state.analyser = {ac, an, buf};
    (function loop(){
      if (!state.analyser) return;
      an.getByteTimeDomainData(buf);
      let sum=0; for(let i=0;i<buf.length;i++){ const d=(buf[i]-128)/128; sum+=d*d; }
      const rms = Math.sqrt(sum/buf.length);
      if (state.listening) state.ampTarget = clamp(rms*5, 0.08, 1);
      requestAnimationFrame(loop);
    })();
  }catch(e){}
}
function stopMicAnalyser(){
  if (state.analyser){ state.analyser.ac.close().catch(()=>{}); state.analyser=null; }
  if (state.micStream){ state.micStream.getTracks().forEach(t=>t.stop()); state.micStream=null; }
  if (!state.speaking) state.ampTarget = 0;
}
function startListening(){
  if (!state.recog && !setupRecognition()){
    jarvisSay('Сэр, ваш браузер не поддерживает распознавание речи. Можно писать текстом.');
    return;
  }
  stopSpeaking();
  try{ state.recog.start(); startMicAnalyser(); }catch(e){}
}
function stopListening(){
  state.continuous = false;
  try{ state.recog && state.recog.stop(); }catch(e){}
  stopMicAnalyser(); Hub.render();
}
$('#micBtn').addEventListener('click', ()=>{
  SFX.click(); Hub.vibrate(30);
  if (state.speaking){ stopSpeaking(); setStatus('ГОТОВ'); return; }
  if (state.listening){ state.continuous=false; try{state.recog.stop();}catch(e){} }
  else { state.continuous = true; startListening(); }
});

function calcCmd(expr){

    .replace(/,/g,'.').replace(/х|×/g,'*').replace(/:/g,'/').replace(/\^/g,'**')
    .replace(/плюс/g,'+').replace(/минус/g,'-').replace(/умножить на/g,'*').replace(/разделить на/g,'/')

const UNITS = {
  'км':{m:1000,cat:'len'},'м':{m:1,cat:'len'},'см':{m:0.01,cat:'len'},'мм':{m:0.001,cat:'len'},
  'мил':{m:1609.34,cat:'len'},'миля':{m:1609.34,cat:'len'},'мили':{m:1609.34,cat:'len'},
  'фут':{m:0.3048,cat:'len'},'фута':{m:0.3048,cat:'len'},'дюйм':{m:0.0254,cat:'len'},
  'кг':{m:1,cat:'mass'},'г':{m:0.001,cat:'mass'},'т':{m:1000,cat:'mass'},
  'фунт':{m:0.453592,cat:'mass'},'lb':{m:0.453592,cat:'mass'},
};
function convertCmd(text){
  const m = text.match(/(-?\d+(?:[.,]\d+)?)\s*([а-яa-z]+)\s*(?:в|в\s+)\s*([а-яa-z]+)/i);
  if (!m) return 'Сэр, формат: «переведи 5 км в мили».';
  const val = parseFloat(m[1].replace(',','.'));
  const from = m[2].toLowerCase(), to = m[3].toLowerCase();
  const f = UNITS[from], t = UNITS[to];
  if (!f || !t || f.cat!==t.cat) return 'Единицы разных категорий или неизвестны, сэр.';
  const r = val * f.m / t.m;
  return `${val} ${from} = ${Math.round(r*10000)/10000} ${to}.`;
}

/* --- УТИЛИТЫ БЕЗОПАСНОСТИ --- */
function genPassword(n){
  n = Math.max(4, Math.min(128, parseInt(n)||16));
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()-_=+[]{}';
  const arr = new Uint32Array(n);
  crypto.getRandomValues(arr);
  let p = '';
  for (let i=0;i<n;i++) p += chars[arr[i]%chars.length];
  return `Сгенерирован пароль (${n} симв.):\n\n${p}`;
}
async function hashCmd(text, algo='SHA-256'){
  const m = text.match(/хэш\s+(?:(\w+)\s+)?(.+)/i);
  if (!m) return 'Сэр, формат: «хэш SHA-256 текст» или «хэш текст».';
  const a = (m[1]||algo).toUpperCase().replace('SHA','SHA-');
  const data = new TextEncoder().encode(m[2]);
  try{
    const buf = await crypto.subtle.digest(a, data);
    const hex = [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    return `${a}: ${hex}`;
  }catch(e){ return 'Алгоритм не поддержан, сэр.'; }
}
function b64Cmd(text, mode){
  try{
    if (mode === 'enc'){
      const s = text.replace(/^(закодируй|base64|в base64)\s*(в base64)?\s*/i,'');
      return btoa(unescape(encodeURIComponent(s)));
    } else {
      const s = text.replace(/^(раскодируй|из base64)\s*/i,'');
      return decodeURIComponent(escape(atob(s.trim())));
    }
  }catch(e){ return 'Некорректные данные для Base64, сэр.'; }
}
function uuidCmd(){ return crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);}); }

/* --- QR-КОД --- */
function qrCmd(text){
  const s = text.replace(/^qr\s*(код)?\s*(для\s+)?/i,'').trim();
  if (!s) return 'Сэр, укажите содержимое QR-кода.';
  const url = `https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=${encodeURIComponent(s)}`;
  openModal('QR-КОД', `<img src="${url}" alt="QR"><div class="row"><button onclick="window.open('${url}','_blank')">↗ Открыть</button></div>`);
  return 'QR-код сгенерирован, сэр. Смотрите в окне.';
}

/* --- НАПОМИНАНИЯ --- */
function remindCmd(text){
  const m = text.match(/напомни(?:\s+через\s+(\d+)\s*(минут|мин|секунд|сек|час|часа|часов))?\s*(.+)/i);
  if (!m) return 'Формат: «напомни через 10 минут позвонить».';
  let ms = 60000, unit = m[2] || 'мин';
  if (m[1]) ms = +m[1] * (/сек/.test(unit)?1000:/час|ч/.test(unit)?3600000:60000);
  const txt = m[3].trim();
  const at = Date.now() + ms;
  const rems = store.get('reminders', []);
  rems.push({text: txt, at});
  store.set('reminders', rems);
  const dt = new Date(at);
  return `Напомню «${txt}» в ${pad(dt.getHours())}:${pad(dt.getMinutes())}.`;
}

/* --- СЕКУНДОМЕР --- */
let swStart = 0, swTimer = null;
function stopwatchCmd(mode){
  if (mode === 'stop'){
    if (swTimer){ clearInterval(swTimer); swTimer=null; }
    return 'Секундомер остановлен, сэр.';
  }
  swStart = Date.now();
  if (swTimer) clearInterval(swTimer);
  swTimer = setInterval(()=>{
    const s = (Date.now()-swStart)/1000;
    setStatus(`СЕКУНДОМЕР: ${s.toFixed(1)} сек`);
  }, 100);
  return 'Секундомер запущен. Скажите «стоп», чтобы остановить.';
}

/* --- СИСТЕМНАЯ ИНФО --- */
function systemInfo(){
  const ua = navigator.userAgent;
  const lang = navigator.language;
  const cores = navigator.hardwareConcurrency || '?';
  const mem = navigator.deviceMemory || '?';
  const dpr = window.devicePixelRatio || 1;
  const w = window.screen.width, h = window.screen.height;
  const info = [
    `Платформа: ${navigator.platform || 'неизвестно'}`,
    `Язык: ${lang}`,
    `Ядер CPU: ${cores}`,
    `Память: ${mem} ГБ`,
    `Экран: ${w}×${h} @${dpr}x`,
    `Онлайн: ${navigator.onLine ? 'да':'нет'}`,
    `Touch: ${'ontouchstart' in window ? 'да':'нет'}`,
    `SpeechRecognition: ${SR ? 'да':'нет'}`,
    `SpeechSynthesis: ${'speechSynthesis' in window ? 'да':'нет'}`,
    `WakeLock: ${'wakeLock' in navigator ? 'да':'нет'}`,
    `Bluetooth: ${'bluetooth' in navigator ? 'да':'нет'}`,
    `USB: ${'usb' in navigator ? 'да':'нет'}`,
    `Geolocation: ${'geolocation' in navigator ? 'да':'нет'}`,
  ].join('\n');
  openModal('СИСТЕМНАЯ ИНФОРМАЦИЯ', `<pre>${info}</pre>`);
  return 'Полный отчёт выведен на экран, сэр.';
}

/* --- ОТКРЫТЬ САЙТ --- */
function openCmd(m){
  let site = m[1].toLowerCase().trim();
  const map = {
    'ютуб':'https://youtube.com','youtube':'https://youtube.com',
    'гугл':'https://google.com','google':'https://google.com',
    'карты':'https://maps.google.com','википедия':'https://ru.wikipedia.org',
    'музыка':'https://music.youtube.com','почта':'https://mail.google.com',
    'телеграм':'https://web.telegram.org','telegram':'https://web.telegram.org',
    'вк':'https://vk.com','vk':'https://vk.com','github':'https://github.com',
    'chatgpt':'https://chat.openai.com',
  };
  const url = map[site] || (/^[\w-]+\.[a-z]{2,}/.test(site) ? 'https://'+site : null);

  window.open(url, '_blank');
  return `Открываю ${site}, сэр. Если окно заблокировано — разрешите всплывающие окна.`;
}

/* --- Роутер --- */
let busy = false;
const cmdQueue = [];
async function handleCommand(raw){
  if (!raw) return;
  cmdQueue.push(raw);
  if (busy) return;
  busy = true;
  while (cmdQueue.length){
    const text = cmdQueue.shift().replace(/^джарвис[,!\s]*/i,'').trim();
    addMsg('user', text || raw);
    let reply = null;
    let matched = false;
    for (const b of BRAIN){
      const m = text.match(b.re);
      if (m){
        matched = true;
        let out;
        try { out = b.fn(m, text); }
        catch(err){ out = 'Сэр, один из моих протоколов дал сбой. Остальные системы в норме.'; }
        if (out===null) { reply=null; break; }
        reply = out; break;
      }
    }
    if (!matched && !text){
      reply = 'Сэр, вы обратились, но не сказали ничего.';
    }
    if (!matched && text){
      reply = rnd([
        `Принято: «${text}». Не распознал команду. Скажите «помощь».`,
        'Хм. Мои нейросети в замешательстве, сэр. Попробуйте «помощь».',
        state.sarcasm ? 'Восхитительная команда, сэр. Жаль, не понимаю. «Помощь» — магическое слово.'
                      : 'Не распознал. Скажите «помощь».',
      ]);
    }
    if (reply) await jarvisSay(reply);
  }
  busy = false;
}
window.handleCommand = handleCommand;
